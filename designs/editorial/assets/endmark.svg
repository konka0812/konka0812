<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="konka — 郑州 · 二〇二六 · 全文完">
  <defs>
    <linearGradient id="em-paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FAF7F2"/>
      <stop offset="0.6" stop-color="#F8F4ED"/>
      <stop offset="1" stop-color="#F1E9DC"/>
    </linearGradient>
    <radialGradient id="em-glow" cx="0.5" cy="0.42" r="0.72">
      <stop offset="0" stop-color="#FFFDF8" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#FFFDF8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="em-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DFD5C6" stop-opacity="0"/>
      <stop offset="0.16" stop-color="#DFD5C6" stop-opacity="1"/>
      <stop offset="0.84" stop-color="#DFD5C6" stop-opacity="1"/>
      <stop offset="1" stop-color="#DFD5C6" stop-opacity="0"/>
    </linearGradient>
    <filter id="em-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1200" height="150" fill="url(#em-paper)"/>
  <rect width="1200" height="150" fill="url(#em-glow)"/>
  <rect width="1200" height="150" filter="url(#em-grain)" opacity="0.048"/>

  <!-- printer's device -->
  <rect x="596" y="26" width="8" height="8" fill="#B3402E"/>
  <rect x="240" y="52" width="720" height="1" fill="url(#em-rule)"/>

  <text x="600" y="106" text-anchor="middle" font-family="Georgia, Cambria, Times New Roman, Songti SC, SimSun, Noto Serif SC, serif"
        font-size="34" letter-spacing="1.5" fill="#14110F">konka</text>

  <text x="600" y="132" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace"
        font-size="9.5" letter-spacing="3.4" fill="#7A6F63">ZHENGZHOU · 郑州 · 2026</text>
</svg>
