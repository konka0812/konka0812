    <circle cx="106.5" cy="80" r="4" fill="url(#s-py)"/>
    <text x="116" y="84" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="10" fill="#94A3B8">PY 5</text>
    <circle cx="165.5" cy="80" r="4" fill="url(#s-ts)"/>
    <text x="175" y="84" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="10" fill="#94A3B8">TS 4</text>
    <circle cx="224.5" cy="80" r="4" fill="url(#s-vue)"/>
    <text x="234" y="84" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace" font-size="10" fill="#94A3B8">VUE 3</text>
    <text x="44" y="106" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace"
          font-size="8.5" letter-spacing="1.2" fill="#64748B">SHELL · HTML · OTHER</text>
  </g>

