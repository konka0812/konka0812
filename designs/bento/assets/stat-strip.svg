  <g>
    <rect x="288" y="12" width="216" height="108" rx="20" fill="url(#s-pane)"/>
    <ellipse cx="350" cy="100" rx="100" ry="42" fill="url(#s-gs)" opacity="0.5"/>
    <rect x="288.5" y="12.5" width="215" height="107" rx="19.5" fill="none" stroke="url(#s-h3)" stroke-width="1"/>
    <rect x="312" y="34" width="3" height="64" rx="1.5" fill="url(#s-mk)"/>
