    <circle cx="560" cy="76" r="5" fill="#FBBF24"/>
    <text x="572" y="92" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
          font-size="40" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">14</text>
    <text x="618" y="90" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif"
          font-size="12" fill="#94A3B8">颗星星</text>
    <text x="560" y="108" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace"
          font-size="8.5" letter-spacing="1.2" fill="#64748B">8 + 4 + 2 · TOP REPO 8★</text>
  </g>

  <!-- tile 4 · 752,12 · 244x108 · since -->
  <g>
    <rect x="752" y="12" width="244" height="108" rx="20" fill="url(#s-pane)"/>
    <ellipse cx="818" cy="100" rx="104" ry="42" fill="url(#s-ge)" opacity="0.5"/>
    <rect x="752.5" y="12.5" width="243" height="107" rx="19.5" fill="none" stroke="url(#s-h2)" stroke-width="1"/>
    <rect x="776" y="34" width="3" height="64" rx="1.5" fill="url(#s-mk)"/>
    <text x="792" y="41" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace"
