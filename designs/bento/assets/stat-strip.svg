    <text x="326" y="92" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
          font-size="40" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">22</text>
    <text x="372" y="90" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif"
          font-size="12" fill="#94A3B8">个开源仓库</text>
    <text x="328" y="108" font-family="SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace"
          font-size="8.5" letter-spacing="1.2" fill="#64748B">ALL PUBLIC · NO FORKS</text>
  </g>

  <!-- tile 3 · 520,12 · 216x108 · stars -->
  <g>
    <rect x="520" y="12" width="216" height="108" rx="20" fill="url(#s-pane)"/>
    <ellipse cx="582" cy="100" rx="100" ry="42" fill="url(#s-gp)" opacity="0.5"/>
    <rect x="520.5" y="12.5" width="215" height="107" rx="19.5" fill="none" stroke="url(#s-h3)" stroke-width="1"/>
    <rect x="544" y="34" width="3" height="64" rx="1.5" fill="url(#s-mk)"/>
