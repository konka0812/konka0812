    <g>
      <ellipse cx="230" cy="120" rx="430" ry="250" fill="url(#b-gV)"/>
      <ellipse cx="1160" cy="50"  rx="350" ry="230" fill="url(#b-gP)"/>
      <ellipse cx="1030" cy="330" rx="330" ry="180" fill="url(#b-gE)"/>
