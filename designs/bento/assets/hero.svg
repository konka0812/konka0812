    <linearGradient id="b-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.05" stop-color="#A78BFA" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#F472B6" stop-opacity="0.80"/>
      <stop offset="0.78" stop-color="#60A5FA" stop-opacity="0.40"/>
      <stop offset="1"    stop-color="#60A5FA" stop-opacity="0"/>
