<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="konka — AI Agent 工具链 / 全栈 Web 开发者，郑州">
  <title>konka · BENTO 玻璃便当格</title>
  <defs>
    <!-- ── base ────────────────────────────────────────────── -->
    <linearGradient id="b-base" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0"    stop-color="#0B0C10"/>
      <stop offset="0.55" stop-color="#0C0E15"/>
      <stop offset="1"    stop-color="#0A0B12"/>
    </linearGradient>

    <!-- ── mesh glow (softness baked into stops, no blur) ──── -->
    <radialGradient id="b-gV"><stop offset="0" stop-color="#A78BFA" stop-opacity="0.70"/><stop offset="0.42" stop-color="#A78BFA" stop-opacity="0.28"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <radialGradient id="b-gP"><stop offset="0" stop-color="#F472B6" stop-opacity="0.54"/><stop offset="0.44" stop-color="#F472B6" stop-opacity="0.19"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
    <radialGradient id="b-gE"><stop offset="0" stop-color="#34D399" stop-opacity="0.56"/><stop offset="0.44" stop-color="#34D399" stop-opacity="0.20"/><stop offset="1" stop-color="#34D399" stop-opacity="0"/></radialGradient>
    <radialGradient id="b-gS"><stop offset="0" stop-color="#60A5FA" stop-opacity="0.52"/><stop offset="0.46" stop-color="#60A5FA" stop-opacity="0.18"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>

    <linearGradient id="b-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0C10" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0C10" stop-opacity="0.60"/>
    </linearGradient>
    <radialGradient id="b-vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.82" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.56"/>
    </radialGradient>

    <!-- ── glass tiles ─────────────────────────────────────── -->
    <linearGradient id="b-pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.085"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.035"/>
    </linearGradient>
    <radialGradient id="b-sheen" cx="0.14" cy="0.02" r="1.05">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- hairline borders: white 18% -> white 4% -->
    <linearGradient id="b-h1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="b-h2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.19"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.045"/>
    </linearGradient>
    <linearGradient id="b-h3" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.19"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.045"/>
    </linearGradient>

    <!-- ── accents ─────────────────────────────────────────── -->
    <linearGradient id="b-mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#A78BFA"/>
      <stop offset="0.34" stop-color="#F472B6"/>
      <stop offset="0.68" stop-color="#60A5FA"/>
      <stop offset="1"    stop-color="#34D399"/>
