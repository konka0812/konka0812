<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="konka — AI Agent / Full-stack Developer, Zhengzhou China">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#06070E"/>
      <stop offset="0.5" stop-color="#090C18"/>
      <stop offset="1" stop-color="#0C1020"/>
    </linearGradient>

    <!-- soft ribbons: softness baked into the radial ramp, no blur filter needed -->
    <radialGradient id="a-r1"><stop offset="0" stop-color="#10B981" stop-opacity="0.72"/><stop offset="0.5" stop-color="#10B981" stop-opacity="0.30"/><stop offset="1" stop-color="#10B981" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-r2"><stop offset="0" stop-color="#6366F1" stop-opacity="0.78"/><stop offset="0.5" stop-color="#6366F1" stop-opacity="0.32"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-r3"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.60"/><stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.22"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-r4"><stop offset="0" stop-color="#EC4899" stop-opacity="0.52"/><stop offset="0.5" stop-color="#EC4899" stop-opacity="0.18"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-r5"><stop offset="0" stop-color="#0EA5E9" stop-opacity="0.44"/><stop offset="0.55" stop-color="#0EA5E9" stop-opacity="0.14"/><stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-base"><stop offset="0" stop-color="#1E293B" stop-opacity="0.55"/><stop offset="1" stop-color="#1E293B" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-f1"><stop offset="0" stop-color="#6EE7B7" stop-opacity="0.6"/><stop offset="1" stop-color="#6EE7B7" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-f2"><stop offset="0" stop-color="#A5B4FC" stop-opacity="0.62"/><stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-f3"><stop offset="0" stop-color="#67E8F9" stop-opacity="0.5"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>

    <linearGradient id="a-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.38" stop-color="#06070E" stop-opacity="0"/>
      <stop offset="1" stop-color="#06070E" stop-opacity="0.72"/>
    </linearGradient>

    <radialGradient id="a-vig" cx="0.5" cy="0.36" r="0.8">
      <stop offset="0.42" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>

    <linearGradient id="a-name" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#E2E8FF"/>
      <stop offset="1" stop-color="#A5B4FC"/>
    </linearGradient>

    <linearGradient id="a-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#34D399" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="0.82" stop-color="#818CF8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <filter id="a-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="a-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>

    <pattern id="a-dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="1.2" fill="#93C5FD"/>
    </pattern>

    <clipPath id="a-clip"><rect width="1200" height="340" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#a-clip)">
    <rect width="1200" height="340" fill="url(#a-bg)"/>

    <!-- aurora field -->
    <g>
      <ellipse cx="640" cy="40" rx="900" ry="230" fill="url(#a-base)"/>
      <ellipse cx="210" cy="30" rx="560" ry="96" fill="url(#a-r1)" transform="rotate(-9 210 30)"/>
      <ellipse cx="800" cy="86" rx="600" ry="118" fill="url(#a-r2)" transform="rotate(-7 800 86)"/>
      <ellipse cx="540" cy="-4" rx="460" ry="72" fill="url(#a-r3)" transform="rotate(-12 540 -4)"/>
      <ellipse cx="1110" cy="46" rx="330" ry="66" fill="url(#a-r4)" transform="rotate(-10 1110 46)"/>
      <ellipse cx="60" cy="152" rx="380" ry="88" fill="url(#a-r5)" transform="rotate(-14 60 152)"/>
      <ellipse cx="330" cy="52" rx="300" ry="13" fill="url(#a-f1)" transform="rotate(-8 330 52)"/>
      <ellipse cx="720" cy="118" rx="340" ry="15" fill="url(#a-f2)" transform="rotate(-6 720 118)"/>
      <ellipse cx="620" cy="26" rx="260" ry="11" fill="url(#a-f3)" transform="rotate(-11 620 26)"/>
    </g>

    <rect width="1200" height="340" fill="url(#a-deep)"/>
    <rect width="1200" height="340" fill="url(#a-vig)"/>
    <rect width="1200" height="340" fill="url(#a-dots)" opacity="0.055"/>
    <rect width="1200" height="340" filter="url(#a-grain)" opacity="0.04"/>

    <!-- content -->
    <text x="600" y="98" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="5.5" fill="#7DD3FC">AI AGENT · FULL-STACK · 3D WEB</text>

    <text x="600" y="212" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
          font-size="110" font-weight="700" letter-spacing="-3.5" fill="#6366F1" opacity="0.55" filter="url(#a-glow)">konka</text>
    <text x="600" y="212" text-anchor="middle" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Arial, sans-serif"
          font-size="110" font-weight="700" letter-spacing="-3.5" fill="url(#a-name)">konka</text>

    <text x="600" y="262" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Noto Sans SC, sans-serif"
          font-size="21" fill="#CBD5E1">把想法变成能跑起来的东西</text>

    <rect x="380" y="294" width="440" height="1.6" rx="0.8" fill="url(#a-rule)"/>

    <text x="600" y="326" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace"
          font-size="12" letter-spacing="2.6" fill="#64748B">@konka0812 · ZHENGZHOU, CHINA</text>
  </g>
</svg>
